[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor
user=root

[program:Xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
user=browser
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -nopw -listen 0.0.0.0 -rfbport 5900
user=browser
autostart=true
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:noVNC]
command=/opt/novnc/utils/websockify/run --web /opt/novnc --wrap-mode=ignore 6080 localhost:5900
user=browser
autostart=true
autorestart=true
priority=3
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:openbox]
command=/usr/bin/openbox
user=browser
environment=DISPLAY=":99",HOME="/home/browser",XAUTHORITY="/home/browser/.Xauthority"
autostart=true
autorestart=true
priority=4
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

[program:dbus]
command=dbus-daemon --system --nofork
user=root
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.err

[program:chromium]
command=/usr/local/bin/start-chromium.sh
user=browser
directory=/home/browser
environment=DISPLAY=":99",HOME="/home/browser",XAUTHORITY="/home/browser/.Xauthority",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus"
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=6